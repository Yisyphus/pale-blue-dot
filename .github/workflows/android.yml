# Builds the Android app (android/) and publishes it at a fixed address:
#   https://github.com/Yisyphus/pale-blue-dot/releases/download/android/PaleBlueDotRadio.apk
# Runs when anything in android/ changes on main, or by hand from the Actions tab. The radio itself (the website)
# updates by itself inside the app; a new APK is only needed when the app around it changes.
name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat android/VERSION)
          cp android/app/build/outputs/apk/release/app-release.apk PaleBlueDotRadio.apk
          notes="Pale Blue Dot Radio for Android, app version $v (build ${{ github.run_number }}).

          Open this page on the phone, download **PaleBlueDotRadio.apk** and open it. Android asks to allow installing apps from your browser the first time: allow it, then install.
          The radio keeps playing when the phone is locked or another app is in front, with play/pause and next on the lock screen. It updates itself from https://yisyphus.github.io/pale-blue-dot/ ; a new APK installs over the old one and keeps your sign-in."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android PaleBlueDotRadio.apk --clobber
            gh release edit android --notes "$notes" --title "Pale Blue Dot Radio for Android" --latest=false
          else
            gh release create android PaleBlueDotRadio.apk --title "Pale Blue Dot Radio for Android" --notes "$notes" --latest=false --target ${{ github.sha }}
          fi
