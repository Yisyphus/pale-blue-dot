<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pale Blue Dot Radio voices</title></head>
<body style="background:#0b1030;color:#cfd8ff;font:14px system-ui,sans-serif;margin:16px">
<p>Pale Blue Dot Radio voices, keep this open.</p><p id="state" style="color:#8ea0d8"></p>
<script>
// The radio's voice engine: Edge speaks every line the host says, with its natural voices. No interface.
// Lines come from the PC helper (Server-Sent Events); what happens to each goes back to it.
const post = o => fetch('/api/voice/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o) }).catch(() => {});
let voices = [];
function sendVoices() { voices = speechSynthesis.getVoices(); post({ type: 'voices', voices: voices.map(v => ({ name: v.name, lang: v.lang, local: v.localService })) }); }
speechSynthesis.onvoiceschanged = sendVoices; sendVoices(); setTimeout(sendVoices, 1500);
setInterval(() => post({ type: 'beat', speaking: speechSynthesis.speaking }), 2000);
function say(m) {
  const u = new SpeechSynthesisUtterance(m.text), v = voices.find(x => x.name === m.voice) || voices.find(x => /natural/i.test(x.name) && /^en/i.test(x.lang));
  if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = m.rate || 1; u.pitch = m.pitch || 1;
  let began = false;
  u.onstart = () => { began = true; post({ id: m.id, type: 'start', voice: v ? v.name : '' }); document.getElementById('state').textContent = 'speaking: ' + m.text.slice(0, 80); };
  u.onboundary = e => post({ id: m.id, type: 'boundary', charIndex: e.charIndex });
  u.onend = () => post({ id: m.id, type: 'end' });
  u.onerror = e => { began = true; post({ id: m.id, type: 'error', error: e.error || 'error' }); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!began) post({ id: m.id, type: 'error', error: 'did not start (blocked?)' }); }, 8000);
}
const inbox = new EventSource('/api/voice/inbox');
inbox.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.cmd === 'pause') speechSynthesis.pause(); else if (m.cmd === 'resume') speechSynthesis.resume(); else if (m.cmd === 'cancel') speechSynthesis.cancel();
  else if (m.text) say(m);
};
</script>
</body></html>
